<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasySatBox Sing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gronn-dyp:#14301f; --gronn:#1f4a30; --gronn-lys:#2c6844;
    --gull:#cfa64e; --gull-lys:#e6c877; --krem:#f6f0e2; --kort:#fbf7ec;
    --tekst:#16281d; --svak:#5a6c60; --roed:#c0503f;
    --skygge:0 18px 50px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif; color:var(--tekst);
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(44,104,68,.45) 0, transparent 60%),
      linear-gradient(160deg,#0e2417 0%, var(--gronn-dyp) 45%, #0b1d12 100%);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(14px,4vw,40px); line-height:1.45;
  }
  #bakteppe{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat}

  .app{width:100%;max-width:560px}

  /* Topplinje: bakgrunn + språk */
  .topp{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
  .toppgruppe{display:flex;align-items:center;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(246,240,226,.14);color:var(--krem);
    border:1.5px solid rgba(230,200,119,.5);border-radius:999px;padding:11px 16px;
    font-family:'Nunito';font-weight:700;font-size:16px;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .pill:hover{background:rgba(246,240,226,.22)}
  .pill:focus-visible{outline:3px solid var(--gull);outline-offset:2px}
  .pill svg{width:20px;height:20px;flex:none}
  .pill--rund{padding:11px;border-radius:50%}
  .pill.aktiv{background:var(--gull);color:var(--gronn-dyp);border-color:var(--gull-lys)}
  .sr-bare{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sprakboks select{appearance:none;-webkit-appearance:none;background:transparent;border:none;color:var(--krem);
    font-family:'Nunito';font-weight:700;font-size:16px;outline:none;cursor:pointer;padding-right:4px}
  .sprakboks select option{color:#16281d;background:#fff}
  .skjult{display:none !important}

  /* Merke */
  .merke{text-align:center;margin-bottom:20px}
  .merke__ring{width:104px;height:104px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%, var(--gronn-lys), var(--gronn) 70%);
    border:4px solid var(--gull);box-shadow:0 0 0 6px rgba(207,166,78,.18), var(--skygge);overflow:hidden}
  .merke__ring img{width:100%;height:100%;object-fit:cover}
  .merke__ring span{font-family:'Fraunces';font-size:34px;color:var(--gull-lys)}
  .merke h1{font-family:'Fraunces';font-weight:600;letter-spacing:.14em;color:var(--krem);
    font-size:clamp(22px,6vw,30px);text-transform:uppercase}
  .merke p{color:var(--gull-lys);font-weight:700;letter-spacing:.28em;font-size:13px;margin-top:2px}

  /* Fremdrift */
  .fremdrift{display:flex;gap:8px;justify-content:center;align-items:flex-end;height:26px;margin:0 auto 18px}
  .fremdrift i{width:7px;height:12px;border-radius:4px;background:rgba(230,200,119,.28);transition:all .35s ease}
  .fremdrift i.paa{background:var(--gull-lys);height:22px}

  /* Scene */
  .scene{background:var(--kort);border-radius:26px;padding:clamp(22px,6vw,34px);
    box-shadow:var(--skygge);border:1px solid rgba(207,166,78,.35)}
  .steg{display:none;animation:inn .4s ease both}
  .steg.aktiv{display:block}
  @media (prefers-reduced-motion:reduce){.steg{animation:none}}
  @keyframes inn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .eyebrow{color:var(--gull);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
  h2{font-family:'Fraunces';font-weight:600;font-size:clamp(26px,7vw,34px);margin:4px 0 6px;line-height:1.1}
  .ingress{font-size:clamp(17px,4.5vw,19px);color:var(--svak);margin-bottom:24px}

  .knapp{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
    font-family:'Nunito';font-weight:800;font-size:21px;padding:20px 22px;border:none;border-radius:18px;cursor:pointer;
    background:linear-gradient(180deg,var(--gronn-lys),var(--gronn));color:var(--krem);
    box-shadow:0 8px 20px rgba(20,48,31,.35);transition:transform .12s ease,filter .12s ease;min-height:64px}
  .knapp:hover{filter:brightness(1.07)}
  .knapp:active{transform:translateY(2px)}
  .knapp:focus-visible{outline:4px solid var(--gull);outline-offset:3px}
  .knapp--gull{background:linear-gradient(180deg,var(--gull-lys),var(--gull));color:var(--gronn-dyp)}
  .knapp--stor{font-size:23px;padding:24px}
  .knapp[disabled]{opacity:.45;cursor:not-allowed}
  .knapp svg{width:26px;height:26px;flex:none}

  .lenke{display:block;width:100%;text-align:center;background:none;border:none;cursor:pointer;
    color:var(--gronn-lys);font-family:'Nunito';font-weight:700;font-size:17px;padding:14px;margin-top:6px;text-decoration:underline}
  .lenke:focus-visible{outline:3px solid var(--gull);outline-offset:2px;border-radius:8px}

  .rad{display:flex;gap:12px;margin-top:16px}
  .rad .knapp{font-size:18px;padding:16px}

  .foto{width:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;background:#e8e1cc;
    border:3px solid var(--gull);box-shadow:inset 0 0 0 6px rgba(255,255,255,.5)}

  .mikstage{text-align:center;margin:8px 0 18px}
  .mikknapp{width:150px;height:150px;border-radius:50%;border:5px solid var(--gull);cursor:pointer;
    background:radial-gradient(circle at 50% 40%,var(--gronn-lys),var(--gronn));color:var(--krem);
    display:grid;place-items:center;margin:0 auto;box-shadow:0 0 0 0 rgba(192,80,63,.5);transition:transform .12s ease}
  .mikknapp:active{transform:scale(.96)}
  .mikknapp:focus-visible{outline:4px solid var(--gull);outline-offset:4px}
  .mikknapp svg{width:56px;height:56px}
  .mikknapp.tar-opp{background:radial-gradient(circle at 50% 40%,#d5604d,var(--roed));border-color:var(--gull-lys)}
  @media (prefers-reduced-motion:no-preference){.mikknapp.tar-opp{animation:puls 1.3s infinite}}
  @keyframes puls{0%{box-shadow:0 0 0 0 rgba(192,80,63,.5)}70%{box-shadow:0 0 0 24px rgba(192,80,63,0)}100%{box-shadow:0 0 0 0 rgba(192,80,63,0)}}
  .timer{font-family:'Fraunces';font-size:40px;margin-top:14px;color:var(--gronn)}
  .hint{font-size:16px;color:var(--svak);margin-top:4px}
  audio{width:100%;margin-top:16px}

  .samtykke{display:flex;gap:12px;align-items:flex-start;background:#efe8d3;border-radius:14px;padding:16px;margin-top:18px;font-size:16px;text-align:left}
  .samtykke input{width:26px;height:26px;flex:none;margin-top:1px;accent-color:var(--gronn-lys)}
  .samtykke label{cursor:pointer}

  .sanger{display:grid;gap:12px;margin-bottom:8px}
  .anledninger{display:grid;gap:12px;margin-bottom:8px}
  .scener{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  .scenekort{position:relative;border:3px solid #e6ddc4;border-radius:16px;overflow:hidden;cursor:pointer;padding:0;background:none}
  .scenekort img{width:100%;aspect-ratio:768/1376;object-fit:cover;display:block}
  .scenekort span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(10,22,15,.85));color:var(--krem);font-family:'Nunito';font-weight:800;font-size:15px;padding:18px 10px 10px;text-align:center}
  .scenekort:hover{border-color:var(--gull)}
  .scenekort:focus-visible{outline:4px solid var(--gull);outline-offset:2px}
  .scenekort.valgt{border-color:var(--gronn-lys);box-shadow:0 0 0 3px rgba(44,104,68,.35)}
  .feltnavn{display:block;font-weight:800;font-size:17px;margin:6px 0 8px}
  #hilsenTekst{width:100%;font-family:'Nunito';font-weight:800;font-size:20px;padding:16px 18px;border:3px solid #e6ddc4;border-radius:14px;background:#fff;color:var(--tekst)}
  #hilsenTekst:focus{outline:none;border-color:var(--gull)}
  .forslag{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .forslag button{background:#efe8d3;border:none;border-radius:999px;padding:10px 14px;font-family:'Nunito';font-weight:700;font-size:15px;cursor:pointer;color:var(--tekst)}
  .forslag button:hover{background:var(--gull-lys)}
  .forslag button:focus-visible{outline:3px solid var(--gull);outline-offset:2px}
  .sang{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    background:#fff;border:3px solid #e6ddc4;border-radius:16px;padding:16px 18px;
    font-family:'Nunito';font-size:19px;font-weight:700;color:var(--tekst);transition:border-color .15s,background .15s}
  .sang:hover{border-color:var(--gull)}
  .sang:focus-visible{outline:4px solid var(--gull);outline-offset:2px}
  .sang.valgt{border-color:var(--gronn-lys);background:#eef5ef}
  .sang__ikon{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:linear-gradient(180deg,var(--gull-lys),var(--gull));color:var(--gronn-dyp)}
  .sang__navn{flex:1;min-width:0}
  .sang__meta{font-size:14px;font-weight:600;color:var(--svak)}
  .horknapp{margin-left:auto;display:flex;align-items:center;gap:7px;flex:none;
    background:var(--gronn-lys);color:var(--krem);border:none;border-radius:12px;padding:12px 16px;
    font-family:'Nunito';font-weight:800;font-size:16px;cursor:pointer}
  .horknapp:hover{filter:brightness(1.08)}
  .horknapp:focus-visible{outline:3px solid var(--gull);outline-offset:2px}
  .horknapp.spiller{background:var(--gull);color:var(--gronn-dyp)}
  .horknapp svg{width:20px;height:20px}

  .laster{text-align:center;padding:20px 0}
  .snurr{width:120px;height:120px;margin:0 auto 22px;border-radius:50%;border:8px solid rgba(207,166,78,.25);border-top-color:var(--gull)}
  @media (prefers-reduced-motion:no-preference){.snurr{animation:rundt 1s linear infinite}}
  @keyframes rundt{to{transform:rotate(360deg)}}
  .laster p{font-size:20px;font-weight:800;color:var(--gronn);min-height:28px}

  video{width:100%;border-radius:20px;background:#000;border:3px solid var(--gull)}

  .varsel{background:#f7e4df;border:2px solid var(--roed);color:#7a2a1e;border-radius:14px;padding:16px;font-size:16px;font-weight:700;margin-top:16px}
</style>
</head>
<body>
<div id="bakteppe"></div>
<div class="app">
  <div id="live" class="sr-bare" role="status" aria-live="polite"></div>

  <div class="topp">
    <div class="toppgruppe">
      <button class="pill" id="bakgrunnKnapp" onclick="document.getElementById('bakgrunnInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5L5 20"/></svg>
        <span data-i18n="bakgrunn">Bakgrunn</span>
      </button>
      <button class="pill pill--rund skjult" id="fjernBakgrunn" onclick="fjernBakteppe()" aria-label="Fjern bakgrunn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="pill pill--rund" id="lesKnapp" onclick="veksleLes()" aria-pressed="false" data-i18n-aria="lesOpp" aria-label="Les opp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
      </button>
    </div>
    <label class="pill sprakboks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
      <select id="sprak" onchange="settSprak(this.value)" data-i18n-aria="velgSprak" aria-label="Velg språk"></select>
    </label>
  </div>

  <div class="merke">
    <div class="merke__ring">
      <img src="logo.png" alt="EasySatBox Sing" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span style="display:none">♪</span>
    </div>
    <h1>EasySatBox</h1>
    <p>SING</p>
  </div>

  <div class="fremdrift" id="fremdrift" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="scene">

    <section class="steg aktiv" id="steg1">
      <div class="eyebrow" data-steg="1"></div>
      <h2 data-i18n="s1t"></h2>
      <p class="ingress" data-i18n="s1i"></p>
      <img id="fotoVis" class="foto skjult" alt="">
      <div id="fotoValg">
        <button class="knapp knapp--stor" onclick="document.getElementById('kamera').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span data-i18n="taBilde"></span>
        </button>
        <button class="lenke" data-i18n="velgBilder" onclick="document.getElementById('galleri').click()"></button>
      </div>
      <div id="fotoKlar" class="skjult">
        <div class="rad">
          <button class="knapp" data-i18n="paaNytt" onclick="nullstillFoto()"></button>
          <button class="knapp knapp--gull" data-i18n="videre" onclick="visSteg(2)"></button>
        </div>
      </div>
      <input type="file" id="kamera" accept="image/*" capture="user" class="skjult" onchange="lastBilde(this)">
      <input type="file" id="galleri" accept="image/*" class="skjult" onchange="lastBilde(this)">
    </section>

    <section class="steg" id="steg2">
      <div class="eyebrow" data-steg="2"></div>
      <h2 data-i18n="s2t"></h2>
      <p class="ingress" data-i18n="s2i"></p>
      <div class="mikstage">
        <button class="mikknapp" id="mikknapp" onclick="veksleOpptak()">
          <svg id="mikIkon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
        </button>
        <div class="timer" id="timer">0:00</div>
        <div class="hint" id="mikHint"></div>
      </div>
      <audio id="stemmeVis" controls class="skjult"></audio>
      <div class="samtykke">
        <input type="checkbox" id="samtykke" onchange="oppdaterSteg2()">
        <label for="samtykke" data-i18n="samtykke"></label>
      </div>
      <div class="rad">
        <button class="knapp" data-i18n="tilbake" onclick="visSteg(1)"></button>
        <button class="knapp knapp--gull" id="steg2videre" data-i18n="videre" onclick="visSteg(3)" disabled></button>
      </div>
    </section>

    <section class="steg" id="steg3">
      <div class="eyebrow" data-steg="3"></div>

      <!-- 3a: Hva feirer du? -->
      <div id="anledningView">
        <h2 data-i18n="hvaFeirer"></h2>
        <p class="ingress" data-i18n="hvaFeirerIngress"></p>
        <div class="anledninger" id="anledninger"></div>
        <div class="rad">
          <button class="knapp" data-i18n="tilbake" onclick="visSteg(2)"></button>
        </div>
      </div>

      <!-- 3b: Velg en sang -->
      <div id="sangView" class="skjult">
        <h2 data-i18n="s3t"></h2>
        <p class="ingress" data-i18n="s3i"></p>
        <div class="sanger" id="sanger"></div>
        <div class="rad">
          <button class="knapp" data-i18n="andreAnledninger" onclick="visAnledninger()"></button>
          <button class="knapp knapp--gull knapp--stor" id="lagKnapp" data-i18n="lagVideoen" onclick="lagVideo()" disabled></button>
        </div>
      </div>
    </section>

    <!-- FJORD: velg scene + skriv hilsen -->
    <section class="steg" id="stegFjord">
      <div class="eyebrow" data-steg="3"></div>
      <h2 data-i18n="fjordTittel"></h2>
      <p class="ingress" data-i18n="fjordIngress"></p>
      <div class="scener" id="scenerBoks"></div>
      <label class="feltnavn" for="hilsenTekst" data-i18n="hilsenLabel"></label>
      <input type="text" id="hilsenTekst" maxlength="40" autocomplete="off" oninput="oppdaterFjordKnapp();tegnForh()">
      <div class="forslag" id="hilsenForslag"></div>
      <label class="feltnavn" data-i18n="s3t" style="margin-top:18px"></label>
      <div class="sanger" id="fjordSanger"></div>
      <img id="fjordForh" class="foto skjult" alt="" style="aspect-ratio:768/1376;margin-top:14px">
      <div class="rad">
        <button class="knapp" data-i18n="tilbake" onclick="visAnledninger()"></button>
        <button class="knapp knapp--gull knapp--stor" id="fjordLagKnapp" data-i18n="lagVideoen" onclick="lagFjordVideo()" disabled></button>
      </div>
    </section>

    <section class="steg" id="steg4">
      <div class="laster">
        <div class="snurr"></div>
        <p id="lasterTekst"></p>
        <p class="hint" data-i18n="lasterHint"></p>
      </div>
    </section>

    <section class="steg" id="stegFerdig">
      <div class="eyebrow" data-i18n="ferdig"></div>
      <h2 data-i18n="rt"></h2>
      <p class="ingress" data-i18n="ri"></p>
      <video id="resultatVideo" controls playsinline></video>
      <a class="knapp knapp--gull knapp--stor" id="lastNed" download="min-sang.mp4" data-i18n="lastNed" style="margin-top:18px;text-decoration:none"></a>
      <button class="lenke" data-i18n="lagNy" onclick="startPaaNytt()"></button>
    </section>

    <div id="feil" class="varsel skjult"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   KONFIGURASJON — absolutt URL til delt tjeneste-funksjon
   ══════════════════════════════════════════════════════════ */
const TJENESTE = "https://easysatbox-photoenhancer.netlify.app/.netlify/functions/sing";

/* Sangbibliotek lastes fra sanger.json (ligger ved siden av index.html).
   Ny sang = én linje i sanger.json + last opp mp3-en. Ingen kodeendring. */
let SANGER = [];
const STANDARD_SANGER = [
  { id:"haugen", tittel:"Sangen om Haugen", meta:"Egenlaget", anledning:"Egne sanger", fil:"sangen-om-haugen.mp3" }
];
async function lastSanger(){
  let data = STANDARD_SANGER;
  try{
    const r = await fetch("sanger.json", { cache:"no-store" });
    if(r.ok){ const j = await r.json(); if(Array.isArray(j) && j.length) data = j; }
  }catch(e){}
  SANGER = data.map(s => ({
    ...s,
    anledning: s.anledning || "Sanger",
    url: s.fil ? new URL(s.fil, location.href).href : (s.url || "")
  }));
}

/* Fjordscener lastes fra scener.json */
let SCENER = [];
async function lastScener(){
  try{
    const r = await fetch("scener.json", { cache:"no-store" });
    if(r.ok){ const j = await r.json(); if(Array.isArray(j)) SCENER = j; }
  }catch(e){}
}

/* ── Språk (12, som Photo Enhancer) ───────────────────── */
const SPRAK = [["no","Norsk"],["en","English"],["de","Deutsch"],["fr","Français"],["es","Español"],
  ["it","Italiano"],["ru","Русский"],["ja","日本語"],["zh","中文"],["pl","Polski"],["lv","Latviešu"],["lt","Lietuvių"]];

const I18N = {

}

/* ── Stemmeopptak (MediaRecorder — virker i alle tre dører) ── */
async function veksleOpptak(){
  if(mediaRecorder && mediaRecorder.state==="recording"){ stoppOpptak(); return; }
  try{
    const strom=await navigator.mediaDevices.getUserMedia({audio:true});
    opptakBiter=[];
    mediaRecorder=new MediaRecorder(strom);
    mediaRecorder.ondataavailable=e=>opptakBiter.push(e.data);
    mediaRecorder.onstop=()=>{
      strom.getTracks().forEach(t=>t.stop());
      stemmeBlob=new Blob(opptakBiter,{type:mediaRecorder.mimeType||"audio/webm"});
      const a=document.getElementById("stemmeVis");
      a.src=URL.createObjectURL(stemmeBlob); a.classList.remove("skjult");
      oppdaterSteg2();
    };
    mediaRecorder.start();
    sekunder=0; oppdaterTimer();
    opptakTimer=setInterval(()=>{ sekunder++; oppdaterTimer(); if(sekunder>=30) stoppOpptak(); },1000);
    mikTilstand="stopp";
    document.getElementById("mikknapp").classList.add("tar-opp");
    document.getElementById("mikknapp").setAttribute("aria-label", T("mikStopp"));
    document.getElementById("mikIkon").innerHTML='<rect x="6" y="6" width="12" height="12" rx="2"/>';
    document.getElementById("mikHint").textContent=T("mikStopp");
    lesOpp(T("mikStopp"));
  }catch(e){ visFeil(T("feilMik")); }
}
function stoppOpptak(){
  if(mediaRecorder && mediaRecorder.state==="recording") mediaRecorder.stop();
  clearInterval(opptakTimer);
  mikTilstand="ferdig";
  document.getElementById("mikknapp").classList.remove("tar-opp");
  document.getElementById("mikknapp").setAttribute("aria-label", T("mikStart"));
  document.getElementById("mikIkon").innerHTML='<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>';
  document.getElementById("mikHint").textContent=T("mikFerdig");
  lesOpp(T("mikFerdig"));
}
function oppdaterTimer(){
  const m=Math.floor(sekunder/60), s=String(sekunder%60).padStart(2,"0");
  document.getElementById("timer").textContent=m+":"+s;
}
function oppdaterSteg2(){
  document.getElementById("steg2videre").disabled = false; // v1: opptak ikke påkrevd
}

/* Bakgrunnsfjerning i nettleseren (lastes ved behov) */
let bgLib=null;
async function fjernBakgrunn(blob){
  if(utklippCache && utklippKilde===blob) return utklippCache;
  if(!bgLib){
    bgLib = await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm");
  }
  const ut = await bgLib.removeBackground(blob);
  utklippCache = ut; utklippKilde = blob;
  return ut;
}

/* Composite: scene + person (bak skiltet) + tekst på skiltet */
async function byggComposite(medPerson){
  const sc = valgtScene; if(!sc) return null;
  const W=768, H=1376;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d");
  const scene=await lastBildeUrl(sc.fil);
  ctx.drawImage(scene,0,0,W,H);

  if(medPerson && bildeBlob){
    const utklipp = await fjernBakgrunn(bildeBlob);
    const p = await lastBildeEl(utklipp);
    const pl = sc.person;
    const skiltTopp = sc.skilt.y1*H;
    // Skaler så personen fyller bredden, topp ved pl.topp; klippes ved skiltkanten
    let bredde = pl.maksBredde*W;
    let hoyde  = bredde * (p.height/p.width);
    const maksHoyde = (skiltTopp - pl.topp*H) * 1.35;   // litt overlapp bak skiltet
    if(hoyde > maksHoyde){ hoyde = maksHoyde; bredde = hoyde * (p.width/p.height); }
    const px = pl.cx*W - bredde/2;
    const py = pl.topp*H;
    const s0=sc.skilt;
    ctx.save();
    // Klipp: aldri under skiltkanten, og aldri bredere enn skiltet (+ liten marg)
    const marg=(s0.x2-s0.x1)*W*0.03;
    ctx.beginPath(); ctx.rect(s0.x1*W+marg, 0, (s0.x2-s0.x1)*W-2*marg, skiltTopp+8);
    ctx.clip();
    ctx.drawImage(p, px, py, bredde, hoyde);
    ctx.restore();
    // tegn skiltdelen av scenen oppå igjen så fjøla ligger foran personen
    const s=sc.skilt;
    ctx.drawImage(scene, s.x1*W-10, s.y1*H-10, (s.x2-s.x1)*W+20, (s.y2-s.y1)*H+20,
                          s.x1*W-10, s.y1*H-10, (s.x2-s.x1)*W+20, (s.y2-s.y1)*H+20);
  }

  // Tekst på skiltet
  const tekst = document.getElementById("hilsenTekst").value.trim().toUpperCase();
  if(tekst){
    const s=sc.skilt;
    const bx1=s.x1*W*1.0+ (s.x2-s.x1)*W*0.06, bx2=s.x2*W - (s.x2-s.x1)*W*0.06;
    const by1=s.y1*H + (s.y2-s.y1)*H*0.07,    by2=s.y2*H - (s.y2-s.y1)*H*0.07;
    let linjer=[tekst];
    if(tekst.length>14 && tekst.includes(" ")){
      let mid=Math.floor(tekst.length/2), best=-1, avst=1e9;
      for(let i=0;i<tekst.length;i++){ if(tekst[i]===" " && Math.abs(i-mid)<avst){avst=Math.abs(i-mid);best=i;} }
      if(best>0) linjer=[tekst.slice(0,best), tekst.slice(best+1)];
    }
    let size=150;
    for(; size>=18; size-=4){
      ctx.font=`700 ${size}px Fraunces, Georgia, serif`;
      const maks=Math.max(...linjer.map(l=>ctx.measureText(l).width));
      if(maks<=(bx2-bx1) && size*1.2*linjer.length<=(by2-by1)) break;
    }
    ctx.textAlign="center"; ctx.textBaseline="middle";
    const cx=(bx1+bx2)/2;
    let y=(by1+by2)/2 - (linjer.length-1)*size*0.62;
    linjer.forEach(l=>{
      ctx.font=`700 ${size}px Fraunces, Georgia, serif`;
      ctx.fillStyle="rgba(235,225,200,.9)"; ctx.fillText(l, cx+2, y+2);
      ctx.fillStyle="#4a341c";              ctx.fillText(l, cx, y);
      y+=size*1.24;
    });
  }
  return c;
}
function lastBildeUrl(url){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=url;});}

let forhTimer=null;
function tegnForh(){
  clearTimeout(forhTimer);
  forhTimer=setTimeout(async ()=>{
    if(!valgtScene) return;
    try{
      const c=await byggComposite(false);            // rask forhåndsvisning uten person
      const img=document.getElementById("fjordForh");

async function lagFjordVideo(){
  if(!valgtScene || !bildeBlob) return;
  if(TJENESTE.includes("DIN-TJENESTE-APP")){ visFeil(T("feilTjeneste")); return; }
  const sang = fjordSang;
  if(!sang || !sang.url){ visFeil(T("feilSang")); return; }

  visSeksjon("steg4"); startLaster();
  try{
    const c=await byggComposite(true);               // full composite med utklipt person
    const bildeData=c.toDataURL("image/jpeg",0.88);
    const vid=await kall("startVideo",{ bilde: bildeData, audioUrl: sang.url,
      prompt: "The person behind the wooden sign sings warmly and joyfully — expressive face, genuine smile, natural head movement. The landscape stays still." });
    const { videoUrl }=await vent("pollVideo", vid.id);
    const blob=await (await fetch(videoUrl)).blob();
    const lokal=URL.createObjectURL(blob);
    clearInterval(lasteTimer);

    document.getElementById("lastNed").href=lokal;
    visSeksjon("stegFerdig");

    visFjord();

/* ── Hjelpere ─────────────────────────────────────────── */
function blobTilData(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});}
function lastBildeEl(blob){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(blob);});}
async function bildeTilData(blob, maks=1024, q=0.85){
  const b=await lastBildeEl(blob);
  const s=Math.min(1,maks/Math.max(b.width,b.height));
  const c=document.createElement("canvas"); c.width=Math.round(b.width*s); c.height=Math.round(b.height*s);
  c.getContext("2d").drawImage(b,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}

/* ── Lag video (async + polling, ingen lagring) ───────── */
let lasteTimer=null;
function startLaster(){
  const arr = (I18N[AKTIV] && I18N[AKTIV].laster) || I18N.no.laster;
  let i=0; const el=document.getElementById("lasterTekst");
  el.textContent=arr[0];
  lasteTimer=setInterval(()=>{ i=(i+1)%arr.length; el.textContent=arr[i]; },4000);
}
async function kall(action, body){
  const r=await fetch(`${TJENESTE}?action=${action}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||"feil"); return d;
}
async function vent(action, id){
  for(let i=0;i<150;i++){
    const d=await kall(action,{id});
    if(d.status==="done") return d;
    if(d.status==="error") throw new Error(d.error||"feil");
    await new Promise(r=>setTimeout(r,2000));
  }
  throw new Error("timeout");
}
async function lagVideo(){
  if(!bildeBlob || !valgtSang) return;
  stoppForhands();
  if(!valgtSang.url){ visFeil(T("feilSang")); return; }
  if(TJENESTE.includes("DIN-TJENESTE-APP")){ visFeil(T("feilTjeneste")); return; }

  visSeksjon("steg4"); startLaster();
  try{
    // v1: bilde + sang rett til OmniHuman (stemmekloning kommer i v2)
    const bildeData=await bildeTilData(bildeBlob, 1024, 0.85);
    const vid=await kall("startVideo",{ bilde: bildeData, audioUrl: valgtSang.url, prompt: valgtSang.prompt || "" });
    const { videoUrl }=await vent("pollVideo", vid.id);

    const blob=await (await fetch(videoUrl)).blob();
    const lokal=URL.createObjectURL(blob);
    clearInterval(lasteTimer);
    document.getElementById("resultatVideo").src=lokal;
    document.getElementById("lastNed").href=lokal;
    visSeksjon("stegFerdig");
  }catch(e){
    clearInterval(lasteTimer);
    console.error(e);
    visSeksjon("steg3");
    visFeil(T("feilVideo"));
  }
}
function startPaaNytt(){
  stoppForhands();
  nullstillFoto(); stemmeBlob=null; valgtSang=null; valgtAnledning=null; valgtScene=null; fjordSang=null; utklippCache=null; mikTilstand="start";
  document.getElementById("stemmeVis").classList.add("skjult");
  document.getElementById("samtykke").checked=false;
  document.getElementById("timer").textContent="0:00";

  document.getElementById("lagKnapp").disabled=true;
  oppdaterSteg2(); visSteg(1);
}

/* ── Opplesing (speechSynthesis — virker i alle tre dører) ── */
function velgStemme(kode){
  try{
    const full=(BCP[kode]||"en-US").toLowerCase(), kort=full.slice(0,2);
    const v=speechSynthesis.getVoices();
    return v.find(x=>x.lang.toLowerCase().startsWith(full)) || v.find(x=>x.lang.toLowerCase().startsWith(kort)) || null;
  }catch(e){ return null; }
}
function lesOpp(tekst){
  if(!lesPaa || !tekst) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(tekst);
    u.lang=BCP[AKTIV]||"en-US"; u.rate=.95;
    const v=velgStemme(AKTIV); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function lesAktivt(){
  const s=document.querySelector(".steg.aktiv"); if(!s) return;
  const synlig=el=>el && el.offsetParent!==null;
  const deler=[];
  const h=[...s.querySelectorAll("h2")].find(synlig); if(h) deler.push(h.textContent);
  const i=[...s.querySelectorAll(".ingress")].find(synlig); if(i) deler.push(i.textContent);
  const mh=s.querySelector("#mikHint"); if(mh && synlig(mh) && mh.textContent) deler.push(mh.textContent);
  lesOpp(deler.join(". "));
}
function kunngjor(tekst){ const l=document.getElementById("live"); if(l) l.textContent=tekst||""; }
function etterStegbytte(){
  const s=document.querySelector(".steg.aktiv"); if(!s) return;
  const h=[...s.querySelectorAll("h2")].find(x=>x.offsetParent!==null) || s.querySelector("h2");
  if(h){ h.setAttribute("tabindex","-1"); if(startet) h.focus({preventScroll:true}); kunngjor(h.textContent); }
  if(startet) lesAktivt();
}
function veksleLes(){
  lesPaa=!lesPaa;
  LAGER.skriv("sing_les", lesPaa?"1":"0");
  const b=document.getElementById("lesKnapp");
  b.classList.toggle("aktiv", lesPaa);
  b.setAttribute("aria-pressed", lesPaa?"true":"false");
  if(lesPaa) lesAktivt(); else { try{ speechSynthesis.cancel(); }catch(e){} }
}

/* ── Feil ─────────────────────────────────────────────── */
function visFeil(t){const f=document.getElementById("feil");f.textContent=t;f.classList.remove("skjult");kunngjor(t);lesOpp(t);}
function skjulFeil(){document.getElementById("feil").classList.add("skjult");}

/* ── Start ────────────────────────────────────────────── */
(async function(){
  const velger=document.getElementById("sprak");
  SPRAK.forEach(([kode,navn])=>{ const o=document.createElement("option"); o.value=kode; o.textContent=navn; velger.appendChild(o); });

  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){}

  await lastSanger(); await lastScener();
  settSprak(LAGER.les("sing_sprak") || (navigator.language||"no").slice(0,2));
  visSteg(1);
  startet=true;
})();
